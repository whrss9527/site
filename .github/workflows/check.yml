name: Validate pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check generated pages
        run: python3 scripts/check_generated.py

      - name: Check links and external requests
        run: python3 scripts/check_links.py
